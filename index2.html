<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLV Streams Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 10px; }
  h1 { font-size: 1.4em; margin: 10px 0; }
  #controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  button { padding: 8px 14px; border-radius: 6px; border: none; background: #0077cc; color: white; font-size: 0.95em; cursor: pointer; }
  button:active { transform: scale(0.98); }
  button:disabled { background: #888; cursor: not-allowed; }
  #status { font-size: 0.85em; color: #555; }
  .card { background: white; padding: 12px; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .name { font-size: 1.05em; font-weight: bold; margin-bottom: 4px; }
  .name a { color: #0077cc; text-decoration: none; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.9em; margin-bottom: 6px; align-items: center; }
  .flow-guide, .story-guide { font-size: 0.85em; padding: 6px 8px; border-radius: 6px; margin-bottom: 8px; display: inline-block; border: 1px solid transparent; }
  .story-green { background: #d4edda; color: #155724; border-color: #c3e6cb; }
  .story-green strong { color: #0b2e13; }
  .story-yellow { background: #fff3cd; color: #856404; border-color: #ffeeba; }
  .story-yellow strong { color: #533f03; }
  .story-red { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
  .story-red strong { color: #4c1118; }
  .alert { margin-top: 6px; padding: 4px 6px; border-radius: 6px; background: #ffe5e5; color: #b00000; font-size: 0.8em; }
  .chart-wrapper { position: relative; height: 180px; width: 100%; margin-top: 6px; }
  #legend { margin-top: 20px; padding: 15px; background: #fff; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9em; }
  .box { width: 20px; height: 20px; border-radius: 4px; margin-right: 10px; }
</style>
</head>
<body>

<h1>SLV Streams Dashboard</h1>
<div id="controls">
  <button id="refresh-btn" onclick="loadAll()">Refresh Now</button>
  <div id="status">Loading...</div>
</div>
<div id="streams"></div>

<div id="legend">
  <h2>Understanding River Conditions</h2>
  <div class="legend-item"><div class="box" style="background: #d4edda;"></div> <strong>Green:</strong> Stable.</div>
  <div class="legend-item"><div class="box" style="background: #fff3cd;"></div> <strong>Yellow:</strong> Shifting (5-15%).</div>
  <div class="legend-item"><div class="box" style="background: #f8d7da;"></div> <strong>Red:</strong> Volatile (>15%).</div>
</div>

<script>
Chart.register(ChartDataLabels);
const apiKey = "1p/J4DJW9hidoM37lgx2i+SqjdPFp8J+";
const stations = [
  { id: "NCLCONCO", name: "North Clear Creek Below Continental Reservoir" },
  { id: "ARKSALCO", name: "Arkansas River at Salida, CO" },
  { id: "ALABELCO", name: "Alamosa River Below Terrace Reservoir" },
  { id: "ALATERCO", name: "Alamosa River Above Terrace Reservoir" },
  { id: "BEVBEVCO", name: "Beaver Creek Below Beaver Creek Reservoir" },
  { id: "CONPLACO", name: "Conejos River Below Platoro Reservoir" },
  { id: "CONMOGCO", name: "Conejos River Near Mogote", gageParam: "GAGE_HT2" },
  { id: "LAJCAPCO", name: "Lajara Creek at Gallegos Ranch Near Capulin" },
  { id: "RIOMILCO", name: "Rio Grande at Thirty Mile Bridge Near Creede" },
  { id: "RIOWAGCO", name: "Rio Grande at Wagon Wheel Gap" },
  { id: "RIOTRICO", name: "Rio Grande Above Trinchera Creek Near La Sauses" },
  { id: "TRIMTNCO", name: "Trinchera Creek Above Mountain Home Reservoir" },
  { id: "LOSORTCO", name: "Los Pinos River Near Ortiz" }
];

function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function fetchDWR(sid, param) {
  const url = `https://dwr.state.co.us/Rest/GET/api/v2/telemetrystations/telemetrytimeserieshour?format=json&abbrev=${sid}&parameter=${param}&startDate=${new Date(Date.now()-864000000).toLocaleDateString()}&endDate=${new Date(Date.now()+86400000).toLocaleDateString()}&apiKey=${encodeURIComponent(apiKey)}`;
  try {
    const res = await fetch(url);
    if (!res.ok) return [];
    const j = await res.json();
    return (j.ResultList || []).map(d => ({ time: d.measDate || d.measDateTime, value: d.measValue != null ? Number(d.measValue) : null }));
  } catch(e) { return []; }
}

const container = document.getElementById("streams");
stations.forEach(s => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="name"><a href="https://dwr.state.co.us/Tools/Stations/${s.id}" target="_blank">${s.name}</a></div><div class="row" id="row-${s.id}"></div><div id="flow-guide-${s.id}" style="display:none;"></div><div id="story-guide-${s.id}" style="display:none;"></div><div class="alert" id="alert-${s.id}" style="display:none;"></div><div class="chart-wrapper"><canvas id="chart-${s.id}"></canvas></div>`;
  container.appendChild(card);
});

async function loadStation(s) {
  const [hFlow, hGage, hTemp] = await Promise.all([fetchDWR(s.id, "DISCHRG"), fetchDWR(s.id, s.gageParam || "GAGE_HT"), fetchDWR(s.id, "TEMP")]);
  if (!hFlow.length) return; 

  const latestFlow = hFlow[hFlow.length-1].value;
  const temp = hTemp.length ? hTemp[hTemp.length-1].value : null;
  document.getElementById(`row-${s.id}`).innerHTML = `<span class="label">Flow:</span> <span class="value">${latestFlow?.toFixed(0) || '—'} cfs ${temp ? '| Temp: ' + temp.toFixed(0) + '°F' : ''}</span>`;

  const prevFlow = hFlow.length > 1 ? hFlow[hFlow.length-2].value : null;
  const flow7 = hFlow.length > 24*7 ? hFlow[hFlow.length-24*7].value : null;
  if (prevFlow && flow7) {
    const pct1 = ((latestFlow-prevFlow)/prevFlow)*100;
    const pct7 = ((latestFlow-flow7)/flow7)*100;
    const theme = Math.abs(pct1) > 15 ? "story-red" : (Math.abs(pct1) >= 5 ? "story-yellow" : "story-green");
    const div = document.getElementById(`flow-guide-${s.id}`);
    div.className = `flow-guide ${theme}`; div.style.display = "block";
    div.innerHTML = `Flow is <strong>${Math.round(Math.abs(pct1))}% ${pct1 >= 0 ? "more" : "less"}</strong> than yesterday and has <strong>${pct7 >= 0 ? "increased" : "decreased"} ${Math.round(Math.abs(pct7))}%</strong> since last week.`;
    if (Math.abs(pct1) >= 10) { document.getElementById(`alert-${s.id}`).style.display = "block"; document.getElementById(`alert-${s.id}`).textContent = `⚠ Rapid flow change: ${Math.round(pct1)}%`; }
  }

  const gage = hGage.length ? hGage[hGage.length-1].value : null;
  const gage1 = hGage.length > 24 ? hGage[hGage.length-25].value : null;
  if (gage && gage1) {
    const pct1G = ((gage-gage1)/gage1)*100;
    const div = document.getElementById(`story-guide-${s.id}`);
    div.className = `story-guide ${Math.abs(pct1G) > 15 ? "story-red" : (Math.abs(pct1G) >= 5 ? "story-yellow" : "story-green")}`;
    div.style.display = "block";
    div.innerHTML = `<strong>Gauge Height: ${gage.toFixed(1)} ft:</strong> Water is <strong>${Math.round(Math.abs(gage-gage1)*12)} inches ${gage >= gage1 ? "higher" : "lower"}</strong> than yesterday.`;
  }

  new Chart(document.getElementById(`chart-${s.id}`).getContext("2d"), {
    type: "line",
    data: {
      labels: hFlow.slice(-24).map(d => new Date(d.time).getHours() + ":00"),
      datasets: [
        { label: "Flow", data: hFlow.slice(-24).map(d => d.value), borderColor: "#0077cc", yAxisID: 'yFlow', datalabels: { display: false } },
        { label: "Gauge", data: hGage.slice(-24).map(d => d.value), borderColor: "#6c757d", borderDash: [5,5], yAxisID: 'yGage', datalabels: { display: false } }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { yFlow: { position: 'left' }, yGage: { position: 'right', grid: { drawOnChartArea: false } } } }
  });
}

async function loadAll() {
  document.getElementById("refresh-btn").disabled = true;
  document.getElementById("status").textContent = "Loading streams...";
  for (const s of stations) { await loadStation(s); await delay(500); }
  document.getElementById("refresh-btn").disabled = false;
  document.getElementById("status").textContent = "Last updated: " + new Date().toLocaleTimeString();
}
loadAll();
</script>
</body>
</html>
