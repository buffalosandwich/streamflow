<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLV Reservoir Storage Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 10px; }
  h1 { font-size: 1.4em; margin: 10px 0; color: #004085; }
  #controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  button { padding: 8px 14px; border-radius: 6px; border: none; background: #0077cc; color: white; font-size: 0.95em; cursor: pointer; }
  button:active { transform: scale(0.98); }
  button:disabled { background: #888; cursor: not-allowed; }
  #status { font-size: 0.85em; color: #555; }
  #reservoirs { transition: opacity 0.3s ease; }
  .card { background: white; padding: 12px; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .name { font-size: 1.05em; font-weight: bold; margin-bottom: 4px; }
  .name a { color: #0077cc; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.9em; margin-bottom: 6px; align-items: center; }
  .label { font-weight: bold; }
  .value { font-weight: bold; color: #333; }
  
  .storage-guide { font-size: 0.85em; padding: 6px 8px; border-radius: 6px; margin-bottom: 8px; display: inline-block; border: 1px solid transparent; }
  .story-green { background: #d4edda; color: #155724; border-color: #c3e6cb; }
  .story-green strong { color: #0b2e13; }
  .story-yellow { background: #fff3cd; color: #856404; border-color: #ffeeba; }
  .story-yellow strong { color: #533f03; }
  .story-red { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
  .story-red strong { color: #4c1118; }
  
  .chart-wrapper { position: relative; height: 160px; width: 100%; margin-top: 6px; }
  
  #legend { margin-top: 20px; padding: 15px; background: #fff; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  #legend h2 { font-size: 1.1em; margin-top: 0; }
  .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.9em; }
  .box { width: 20px; height: 20px; border-radius: 4px; margin-right: 10px; }
</style>
</head>
<body>

<h1>Rio Grande Headwaters - Reservoir Storage Dashboard</h1>
<div id="controls">
  <button id="refresh-btn" onclick="loadAll()">Refresh Now</button>
  <div id="status">Loading reservoir data...</div>
</div>
<div id="reservoirs"></div>

<div id="legend">
  <h2>Understanding Storage Trends</h2>
  <div class="legend-item"><div class="box" style="background: #d4edda;"></div> <strong>Green (&lt; 5% change):</strong> Stable storage levels.</div>
  <div class="legend-item"><div class="box" style="background: #fff3cd;"></div> <strong>Yellow (5% - 15% change):</strong> Moderate filling or drawdown.</div>
  <div class="legend-item"><div class="box" style="background: #f8d7da;"></div> <strong>Red (&gt; 15% change):</strong> Rapid change or heavy drawdown.</div>
</div>

<script>
Chart.register(ChartDataLabels);

const apiKey = "1p/J4DJW9hidoM37lgx2i+SqjdPFp8J+";

const reservoirs = [
  { id: "BEVRESCO", name: "Beaver Reservoir", elev: "8,770 ft" },
  { id: "CONRESCO", name: "Continental Reservoir", elev: "10,270 ft" },
  { id: "LAJRESCO", name: "La Jara Reservoir", elev: "9,700 ft" },
  { id: "MTNRESCO", name: "Mountain Home Reservoir", elev: "8,150 ft" },
  { id: "PLARECCO", name: "Platoro Reservoir", elev: "9,980 ft" },
  { id: "RIORESCO", name: "Rio Grande Reservoir", elev: "9,390 ft" },
  { id: "SANRESCO", name: "Sanchez Reservoir", elev: "8,260 ft" },
  { id: "STMRESCO", name: "Santa Maria Reservoir", elev: "9,490 ft" },
  { id: "TERRESCO", name: "Terrace Reservoir", elev: "8,500 ft" }
];

reservoirs.sort((a, b) => a.name.localeCompare(b.name));

function fmtDate(d) { 
  return `${String(d.getMonth() + 1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`; 
}

async function fetchDWRStorage(sid) {
  const url = `https://dwr.state.co.us/Rest/GET/api/v2/telemetrystations/telemetrytimeserieshour?format=json&abbrev=${sid}&parameter=STORAGE&startDate=${fmtDate(new Date(Date.now()-864000000))}&endDate=${fmtDate(new Date(Date.now()+86400000))}&apiKey=${encodeURIComponent(apiKey)}`;
  try {
    const res = await fetch(url);
    if (!res.ok) return [];
    const j = await res.json();
    return (j.ResultList || []).map(d => ({ 
      time: d.measDate || d.measDateTime, 
      value: d.measValue != null ? Number(d.measValue) : null 
    }));
  } catch(e) { return []; }
}

const container = document.getElementById("reservoirs");
reservoirs.forEach(r => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="name">
      <a href="https://dwr.state.co.us/Tools/Stations/${r.id}" target="_blank">${r.name}</a>
    </div>
    <div class="row">
      <span class="label">Elevation:</span> <span class="value">${r.elev}</span>
    </div>
    <div class="row" id="row-${r.id}"></div>
    <div id="story-${r.id}" style="display:none;"></div>
    <div class="chart-wrapper"><canvas id="chart-${r.id}"></canvas></div>
  `;
  container.appendChild(card);
});

const charts = {};

async function loadReservoir(r) {
  const hist = await fetchDWRStorage(r.id);
  const row = document.getElementById(`row-${r.id}`);
  const storyDiv = document.getElementById(`story-${r.id}`);
  
  if (!hist.length) {
    row.innerHTML = `<span class="label">Storage:</span> <span class="value">Data temporarily unavailable</span>`;
    return;
  }

  const latest = hist[hist.length - 1];
  const prevDay = hist.length > 24 ? hist[hist.length - 25].value : hist[0].value;
  const lastWeek = hist.length > 24*7 ? hist[hist.length - (24*7)].value : hist[0].value;

  row.innerHTML = `<span class="label">Current Storage:</span> <span class="value">${latest.value != null ? latest.value.toLocaleString() + ' ac-ft' : '—'}</span>`;

  if (latest.value != null && prevDay != null && lastWeek != null) {
    const pct1 = ((latest.value - prevDay) / prevDay) * 100;
    const pct7 = ((latest.value - lastWeek) / lastWeek) * 100;
    
    const theme = Math.abs(pct1) > 15 ? "story-red" : (Math.abs(pct1) >= 5 ? "story-yellow" : "story-green");
    storyDiv.className = `storage-guide ${theme}`;
    storyDiv.style.display = "block";
    
    const changeWord = pct1 >= 0 ? "gained" : "lost";
    const trendWord = pct7 >= 0 ? "increased" : "decreased";
    
    storyDiv.innerHTML = `Storage has <strong>${changeWord} ${Math.abs(pct1).toFixed(1)}%</strong> since yesterday, and has <strong>${trendWord} ${Math.abs(pct7).toFixed(1)}%</strong> over the past week.`;
  }

  // Deduplicate hourly readings into one daily value per day
  const dailyStorage = [];
  const seenDates = new Set();
  
  for (let i = hist.length - 1; i >= 0; i--) {
    if (!hist[i].time) continue;
    const dateObj = new Date(hist[i].time);
    const dateStr = dateObj.toLocaleDateString();
    
    if (!seenDates.has(dateStr)) {
      seenDates.add(dateStr);
      dailyStorage.unshift({
        timeLabel: `${dateObj.getMonth() + 1}/${dateObj.getDate()}`,
        value: hist[i].value
      });
    }
  }

  const ctx = document.getElementById(`chart-${r.id}`).getContext("2d");
  
  if (charts[r.id]) charts[r.id].destroy();

  charts[r.id] = new Chart(ctx, {
    type: "line",
    data: {
      labels: dailyStorage.map(d => d.timeLabel),
      datasets: [{
        label: "Storage (ac-ft)",
        data: dailyStorage.map(d => d.value),
        borderColor: "#2e8b57",
        backgroundColor: "rgba(46, 139, 87, 0.1)",
        borderWidth: 2,
        pointRadius: 3,
        tension: 0.3,
        fill: true,
        datalabels: { display: false }
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { 
        legend: { display: false }, 
        tooltip: { 
          mode: "index", 
          intersect: false,
          callbacks: {
            label: (item) => `${item.dataset.label}: ${item.raw != null ? item.raw.toLocaleString() + ' ac-ft' : '—'}`
          }
        } 
      },
      scales: { 
        x: { 
          display: true, 
          ticks: { font: { size: 10, family: 'Arial, sans-serif' } } 
        },
        y: { 
          display: true, 
          ticks: { 
            font: { size: 10, family: 'Arial, sans-serif' },
            callback: (val) => val >= 1000 ? (val / 1000).toFixed(1) + 'k' : val
          },
          title: {
            display: true,
            text: 'acre-feet',
            color: '#2e8b57',
            font: { size: 11, weight: 'bold' }
          }
        }
      }
    }
  });
}

async function loadAll() {
  const btn = document.getElementById("refresh-btn");
  btn.disabled = true;
  document.getElementById("status").textContent = "Contacting DWR servers for reservoir logs...";
  
  for (const r of reservoirs) {
    await loadReservoir(r);
    await new Promise(res => setTimeout(res, 400));
  }
  
  btn.disabled = false;
  document.getElementById("status").textContent = `Last refreshed at ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
}

loadAll();
</script>
</body>
</html>
