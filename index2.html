<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>San Luis Valley Stream & Reservoir Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js & Datalabels Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#082f49',
            },
            forest: {
              50: '#f2f9f5',
              100: '#e1f2e8',
              500: '#16a34a',
              700: '#15803d',
              800: '#166534',
            },
            amber: {
              50: '#fffbeb',
              100: '#fef3c7',
              500: '#d97706',
              700: '#b45309',
            },
            rose: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#e11d48',
              700: '#be123c',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Prevent text selection during chart touch drag */
    canvas {
      touch-action: pan-y;
      user-select: none;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-16">

  <!-- Header Bar -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        <!-- Logo & Title -->
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-inner">
            <i class="fa-solid fa-water text-white text-lg"></i>
          </div>
          <div>
            <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
              SLV Water & Fishing Intel
              <span class="hidden sm:inline-block px-2 py-0.5 text-[11px] font-semibold bg-sky-500/20 text-sky-300 rounded-full border border-sky-400/30">Colorado DWR</span>
            </h1>
            <p class="text-xs text-slate-400">San Luis Valley Real-Time Hydrology & Reservoir Storage</p>
          </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-2">
          <button id="toggle-legend-btn" onclick="toggleLegendModal()" class="p-2 sm:px-3 sm:py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center gap-1.5" title="Condition Legend">
            <i class="fa-solid fa-circle-info text-amber-400"></i>
            <span class="hidden sm:inline">Guide & Legend</span>
          </button>
          
          <button id="refresh-btn" onclick="handleRefresh()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 hover:bg-sky-500 text-white shadow-sm transition flex items-center gap-1.5">
            <i id="refresh-icon" class="fa-solid fa-rotate"></i>
            <span id="refresh-text" class="hidden sm:inline">Refresh Data</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Telemetry Status Bar -->
    <div class="bg-slate-950/80 px-4 py-1.5 border-t border-slate-800/80 text-[11px] text-slate-400 flex flex-wrap items-center justify-between gap-2 max-w-7xl mx-auto">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="sync-status">Ready to load telemetry...</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="last-updated-time">Last update: Pending</span>
        <span class="text-slate-600">•</span>
        <label class="flex items-center gap-1.5 cursor-pointer hover:text-slate-300 transition">
          <input type="checkbox" id="demo-mode-toggle" onchange="toggleDataSource()" class="w-3.5 h-3.5 accent-sky-500 rounded">
          <span>Fast Demo Mode</span>
        </label>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
    
    <!-- Top KPI Highlights Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
      <div class="bg-white rounded-xl p-3 border border-slate-200/80 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">Tracked Waters</p>
          <p class="text-lg sm:text-xl font-bold text-slate-800">22 <span class="text-xs font-normal text-slate-500">(14 St / 8 Res)</span></p>
        </div>
        <div class="w-8 h-8 rounded-lg bg-sky-50 text-sky-600 flex items-center justify-center text-sm">
          <i class="fa-solid fa-map-location-dot"></i>
        </div>
      </div>

      <div class="bg-white rounded-xl p-3 border border-slate-200/80 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">Stable Waters</p>
          <p id="kpi-stable-count" class="text-lg sm:text-xl font-bold text-emerald-600">—</p>
        </div>
        <div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-sm">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
      </div>

      <div class="bg-white rounded-xl p-3 border border-slate-200/80 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">Shifting / Caution</p>
          <p id="kpi-shifting-count" class="text-lg sm:text-xl font-bold text-amber-600">—</p
