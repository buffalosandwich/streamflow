<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLV Streams Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 10px; }
  h1 { font-size: 1.4em; margin: 10px 0; }
  #controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  button { padding: 8px 14px; border-radius: 6px; border: none; background: #0077cc; color: white; font-size: 0.95em; cursor: pointer; }
  button:active { transform: scale(0.98); }
  button:disabled { background: #888; cursor: not-allowed; }
  #status { font-size: 0.85em; color: #555; }
  #streams { transition: opacity 0.3s ease; }
  .card { background: white; padding: 12px; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
  .name { font-size: 1.05em; font-weight: bold; margin-bottom: 4px; }
  .name a { color: #0077cc; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.9em; margin-bottom: 6px; align-items: center; }
  
  .flow-guide, .story-guide { font-size: 0.85em; padding: 6px 8px; border-radius: 6px; margin-bottom: 8px; display: inline-block; border: 1px solid transparent; }
  .story-green { background: #d4edda; color: #155724; border-color: #c3e6cb; }
  .story-green strong { color: #0b2e13; }
  .story-yellow { background: #fff3cd; color: #856404; border-color: #ffeeba; }
  .story-yellow strong { color: #533f03; }
  .story-red { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
  .story-red strong { color: #4c1118; }
  
  .alert { margin-top: 6px; padding: 4px 6px; border-radius: 6px; background: #ffe5e5; color: #b00000; font-size: 0.8em; }
  .chart-wrapper { position: relative; height: 180px; width: 100%; margin-top: 6px; }
</style>
</head>
<body>

<h1>SLV Streams Dashboard</h1>
<div id="controls">
  <button id="refresh-btn" onclick="loadAll()">Refresh Now</button>
  <div id="status">Loading dashboard for the first time...</div>
</div>
<div id="streams"></div>

<script>
Chart.register(ChartDataLabels);

const apiKey = "1p/J4DJW9hidoM37lgx2i+SqjdPFp8J+";

const stations = [
  { id: "NCLCONCO", name: "North Clear Creek Below Continental Reservoir" },
  { id: "ARKSALCO", name: "Arkansas River at Salida, CO" },
  { id: "ALABELCO", name: "Alamosa River Below Terrace Reservoir" },
  { id: "ALATERCO", name: "Alamosa River Above Terrace Reservoir" },
  { id: "BEVBEVCO", name: "Beaver Creek Below Beaver Creek Reservoir" },
  { id: "CONPLACO", name: "Conejos River Below Platoro Reservoir" },
  { id: "CONMOGCO", name: "Conejos River Near Mogote", gageParam: "GAGE_HT2" },
  { id: "LAJCAPCO", name: "Lajara Creek at Gallegos Ranch Near Capulin" },
  { id: "RIOMILCO", name: "Rio Grande at Thirty Mile Bridge Near Creede" },
  { id: "RIOWAGCO", name: "Rio Grande at Wagon Wheel Gap" },
  { id: "RIOTRICO", name: "Rio Grande Above Trinchera Creek Near La Sauses" },
  { id: "TRIMTNCO", name: "Trinchera Creek Above Mountain Home Reservoir" },
  { id: "LOSORTCO", name: "Los Pinos River Near Ortiz" }
];

stations.sort((a, b) => a.name.localeCompare(b.name));

const PARAMS = { DISCHRG: { label: "Current Flow" } };
const DWR_PARAM_MAP = { DISCHRG: "DISCHRG", GAGE_HT: "GAGE_HT", GAGE_HT2: "GAGE_HT2" };

function fmtDate(date) {
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${m}/${d}/${date.getFullYear()}`;
}

function percentChange(current, past) {
  if (current == null || past == null || past === 0) return null;
  return ((current - past) / past) * 100;
}

async function fetchDWRHistory(stationId, paramKey) {
  const dwrParam = DWR_PARAM_MAP[paramKey] || paramKey;
  if (!dwrParam) return [];
  const now = new Date();
  const tenDaysAgo = new Date(now.getTime() - 10 * 24 * 60 * 60 * 1000);
  const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
  const url = `https://dwr.state.co.us/Rest/GET/api/v2/telemetrystations/telemetrytimeserieshour?format=json&abbrev=${stationId}&parameter=${dwrParam}&startDate=${fmtDate(tenDaysAgo)}&endDate=${fmtDate(tomorrow)}&apiKey=${encodeURIComponent(apiKey)}`;
  try {
    const res = await fetch(url);
    if (!res.ok) return [];
    const json = await res.json();
    const list = json.ResultList || [];
    return list.map(d => ({ time: d.measDate || d.measDateTime, value: d.measValue != null ? Number(d.measValue) : null }));
  } catch(e) { return []; }
}

function getLatestAndPrev(history) {
  if (!history || !history.length) return { latestValue: null, latestTime: null, prevValue: null, prevTime: null };
  const latest = history[history.length - 1];
  const prev = history.length > 1 ? history[history.length - 2] : null;
  return { latestValue: latest.value, latestTime: latest.time, prevValue: prev ? prev.value : null, prevTime: prev ? prev.time : null };
}

const container = document.getElementById("streams");
stations.forEach(s => {
  const card = document.createElement("div");
  card.className = "card";
  card.id = `card-${s.id}`;
  card.innerHTML = `
    <div class="name"><a href="https://dwr.state.co.us/Tools/Stations/${s.id}" target="_blank" rel="noopener noreferrer">${s.name}</a></div>
    <div class="row" id="row-${s.id}-DISCHRG"></div>
    <div id="flow-guide-${s.id}" style="display:none;"></div>
    <div id="story-guide-${s.id}" style="display:none;"></div>
    <div class="alert" id="alert-${s.id}" style="display:none;"></div>
    <div class="chart-wrapper"><canvas id="chart-${s.id}"></canvas></div>
  `;
  container.appendChild(card);
});

const charts = {};

function valueAtTarget(history, latestTime, days) {
  if (!history.length || !latestTime) return null;
  const target = new Date(latestTime).getTime() - (days * 24 * 60 * 60 * 1000);
  let best = history[0]; 
  for (const h of history) {
    const t = new Date(h.time).getTime();
    if (t <= target) best = h;
    else break;
  }
  return best ? best.value : null;
}

function formatInches(feet) {
  let inches = Math.round(Math.abs(feet) * 12);
  if (inches === 0) return "0 inches";
  let f = Math.floor(inches / 12);
  let i = inches % 12;
  let parts = [];
  if (f > 0) parts.push(f + (f === 1 ? " foot" : " feet"));
  if (i > 0) parts.push(i + (i === 1 ? " inch" : " inches"));
  return parts.join(" ");
}

async function loadStation(station) {
  const sid = station.id;
  try {
    const targetGageParam = station.gageParam || "GAGE_HT";
    const histFlow = await fetchDWRHistory(sid, "DISCHRG");
    const histGage = await fetchDWRHistory(sid, targetGageParam).catch(() => []);

    const flow = getLatestAndPrev(histFlow);
    const flow1 = valueAtTarget(histFlow, flow.latestTime, 1);
    const flow7 = valueAtTarget(histFlow, flow.latestTime, 7);
    const pct1Flow = percentChange(flow.latestValue, flow1);
    const pct7Flow = percentChange(flow.latestValue, flow7);

    // Flow Story
    const flowGuideDiv = document.getElementById(`flow-guide-${sid}`);
    if (flow.latestValue != null && flow1 != null && flow7 != null) {
      const absPct1 = Math.abs(pct1Flow).toFixed(1);
      const moreLess = pct1Flow >= 0 ? "more" : "less";
      const absPct7 = Math.abs(pct7Flow).toFixed(1);
      const increasedDecreased = pct7Flow >= 0 ? "increased" : "decreased";
      const themeClass = Math.abs(pct1Flow) > 15 ? "story-red" : (Math.abs(pct1Flow) >= 5 ? "story-yellow" : "story-green");
      flowGuideDiv.className = `flow-guide ${themeClass}`;
      flowGuideDiv.style.display = "block";
      flowGuideDiv.innerHTML = `<strong>Current Flow: ${flow.latestValue.toFixed(2)} cfs,</strong> this is <strong>${absPct1}% ${moreLess}</strong> than yesterday and has <strong>${increasedDecreased} ${absPct7}%</strong> since last week.`;
    }

    // Gauge Story
    const storyGuideDiv = document.getElementById(`story-guide-${sid}`);
    const gage = getLatestAndPrev(histGage);
    const gage1 = valueAtTarget(histGage, gage.latestTime, 1);
    const gage7 = valueAtTarget(histGage, gage.latestTime, 7);
    if (gage.latestValue != null && gage1 != null && gage7 != null) {
      const diffFeet = gage.latestValue - gage1;
      const formattedInches = formatInches(diffFeet);
      const higherLower1 = diffFeet >= 0 ? "higher" : "lower";
      const pct1Gage = percentChange(gage.latestValue, gage1);
      const risenDropped1 = pct1Gage >= 0 ? "risen" : "dropped";
      const pct7Gage = percentChange(gage.latestValue, gage7);
      const themeClass = Math.abs(pct1Gage) > 15 ? "story-red" : (Math.abs(pct1Gage) >= 5 ? "story-yellow" : "story-green");
      storyGuideDiv.className = `story-guide ${themeClass}`;
      storyGuideDiv.style.display = "block";
      storyGuideDiv.innerHTML = `<strong>Current Gauge Height: ${gage.latestValue.toFixed(2)} ft:</strong> The water is <strong>${formattedInches} ${higherLower1}</strong> than yesterday and has ${risenDropped1} <strong>${Math.abs(pct1Gage).toFixed(1)}%</strong>, which is <strong>${Math.abs(pct7Gage).toFixed(1)}% ${pct7Gage >= 0 ? "higher" : "lower"}</strong> than last week.`;
    }

    // Chart
    const ctx = document.getElementById(`chart-${sid}`).getContext("2d");
    const dailyFlow = [], seenDates = new Set(), gageMap = {};
    for (const h of histGage) if (h.time && h.value !== null) gageMap[new Date(h.time).toLocaleDateString()] = h.value;
    for (let i = histFlow.length - 1; i >= 0; i--) {
      if (!histFlow[i].time) continue;
      const dateStr = new Date(histFlow[i].time).toLocaleDateString();
      if (!seenDates.has(dateStr)) {
        seenDates.add(dateStr);
        dailyFlow.unshift({ dateStr: dateStr, value: histFlow[i].value });
      }
    }
    const flowSeries = dailyFlow.map(d => d.value);
    const gageSeries = dailyFlow.map(d => gageMap[d.dateStr] ?? null);

    if (charts[sid]) charts[sid].destroy();
    charts[sid] = new Chart(ctx, {
      type: "line",
      data: {
        labels: dailyFlow.map(d => `${new Date(histFlow.find(h => new Date(h.time).toLocaleDateString() === d.dateStr).time).getMonth() + 1}/${new Date(histFlow.find(h => new Date(h.time).toLocaleDateString() === d.dateStr).time).getDate()}`),
        datasets: [
          { label: "Flow", data: flowSeries, borderColor: "#0077cc", borderWidth: 2, tension: 0.3, yAxisID: 'yFlow', datalabels: { align: 'bottom', anchor: 'bottom', font: { size: 10, weight: 'bold' }, formatter: (v, ctx) => { if(ctx.dataIndex===0) return ''; const p = ctx.dataset.data[ctx.dataIndex-1]; const pct = ((v-p)/p)*100; return Math.abs(pct) < 0.1 ? '' : (pct>0 ? '+' : '') + pct.toFixed(1) + '%'; }, color: (ctx) => { if(ctx.dataIndex===0) return '#777'; const p = ctx.dataset.data[ctx.dataIndex-1]; const pct = ((ctx.dataset.data[ctx.dataIndex]-p)/p)*100; return pct > 0.1 ? '#2e8b57' : (pct < -0.1 ? '#b22222' : '#777'); } } },
          { label: "Gauge", data: gageSeries, borderColor: "#6c757d", borderDash: [5, 5], borderWidth: 2, tension: 0.3, yAxisID: 'yGage', datalabels: { align: 'top', anchor: 'top', font: { size: 10, weight: 'bold' }, color: '#6c757d', formatter: (v, ctx) => { if(ctx.dataIndex===0) return ''; const p = ctx.dataset.data[ctx.dataIndex-1]; const pct = ((v-p)/p)*100; return Math.abs(pct) < 0.1 ? '' : (pct>0 ? '+' : '') + pct.toFixed(1) + '%'; }, color: (ctx) => { if(ctx.dataIndex===0) return '#777'; const p = ctx.dataset.data[ctx.dataIndex-1]; const pct = ((ctx.dataset.data[ctx.dataIndex]-p)/p)*100; return pct > 0.1 ? '#2e8b57' : (pct < -0.1 ? '#b22222' : '#777'); } } }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 25, bottom: 20 } }, plugins: { legend: { display: false }, tooltip: { mode: "index", intersect: false } }, scales: { x: { display: true }, yFlow: { type: 'linear', display: true, position: 'left', beginAtZero: true, title: { display: true, text: 'cfs', color: '#0077cc' } }, yGage: { type: 'linear', display: true, position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, title: { display: true, text: 'feet', color: '#6c757d' } } } }
    });
  } catch (e) { console.error("Error loading station", sid, e); }
}

async function loadAll() {
  const status = document.getElementById("status");
  const btn = document.getElementById("refresh-btn");
  btn.disabled = true;
  status.textContent = "Updating stream data...";
  for (const s of stations) await loadStation(s);
  btn.disabled = false;
  status.textContent = `Last refreshed at ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
}
loadAll();
</script>
</body>
</html>
